[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "copilot-protocol"
version = "0.1.0"
description = "RealTime Copilot 有线协议 v1 的 Python 模型（由 JSON Schema 生成）"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.9,<3"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "ruff>=0.7"]

[tool.hatch.build.targets.wheel]
packages = ["copilot_protocol"]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]
