[project]
name = "realtime-copilot"
version = "0.1.0"
description = "RealTime Copilot 的 Python 工作区根（虚拟项目，不发布）"
requires-python = ">=3.11"
dependencies = ["copilot-protocol", "copilot-core"]

[tool.uv.sources]
copilot-protocol = { workspace = true }
copilot-core = { workspace = true }

[tool.uv]
package = false

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "httpx>=0.27",
  "websockets>=13.1",
  "ruff>=0.7",
]

[tool.uv.workspace]
members = ["packages/protocol/python", "services/copilot-core"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["packages/protocol/python", "services/copilot-core"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["packages/protocol/python/tests", "services/copilot-core/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
